<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>Calendar | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
        <link href="/css/navbar.css" rel="stylesheet">
        <link href="/css/animations.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container-fluid container-xxl px-3 px-lg-4">
                <div class="page-header d-flex justify-content-between align-items-end flex-wrap gap-3">
                    <div>
                        <span class="text-primary fw-bold small">YOUR SCHEDULE</span>
                        <h1 class="mt-2 mb-1" id="title">Calendar</h1>
                        <p class="text-secondary mb-0">Your scheduled sessions from MongoDB.</p>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary" id="prevMonth">←</button>
                        <button class="btn btn-outline-primary" id="todayBtn">Today</button>
                        <button class="btn btn-outline-secondary" id="nextMonth">→</button>
                    </div>
                </div>
                <section class="card-soft">
                    <div class="row g-2 text-secondary small fw-bold mb-2">
                        <div class="col">
                            Sun
                        </div>
                        <div class="col">
                            Mon
                        </div>
                        <div class="col">
                            Tue
                        </div>
                        <div class="col">
                            Wed
                        </div>
                        <div class="col">
                            Thu
                        </div>
                        <div class="col">
                            Fri
                        </div>
                        <div class="col">
                            Sat
                        </div>
                    </div>
                    <div class="row row-cols-7 g-2" id="grid">
                    </div>
                </section>
                <section class="card-soft mt-4">
                    <h4>Upcoming sessions</h4>
                    <div class="mt-3" id="upcoming">
                    </div>
                </section>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/calendar.js"></script>
    </body>
</html>
