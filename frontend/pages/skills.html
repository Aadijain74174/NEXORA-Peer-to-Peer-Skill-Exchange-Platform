<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>My Skills | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container-fluid container-xxl px-3 px-lg-4">
                <div class="page-header">
                    <span class="text-primary fw-bold small">SKILL INVENTORY</span>
                    <h1 class="mt-2">My skills</h1>
                    <p class="text-secondary">Manage the teaching and learning skills that drive your matches.</p>
                </div>
                <section class="card-soft">
                    <form id="skillsForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Skills I can teach</label>
                                <textarea class="form-control" id="teachSkills" placeholder="Python, C++, Public Speaking" rows="5">
                                </textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Skills I want to learn</label>
                                <textarea class="form-control" id="learnSkills" placeholder="MongoDB, UI Design, Git" rows="5">
                                </textarea>
                            </div>
                        </div>
                        <button class="btn btn-primary mt-4">Save skills</button>
                        <div class="mt-3" id="msg">
                        </div>
                    </form>
                </section>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/skills.js"></script>
    </body>
</html>
