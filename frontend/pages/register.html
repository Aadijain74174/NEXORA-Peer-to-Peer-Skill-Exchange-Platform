<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>Register | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container" style="max-width:620px">
                <section class="card-soft">
                    <span class="text-primary fw-bold small">JOIN THE NETWORK</span>
                    <h1 class="mt-2">Create your Nexora account</h1>
                    <p class="text-secondary">Start with the skills you already have.</p>
                    <form class="mt-4" id="registerForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Name</label>
                                <input class="form-control" id="name" required="">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email</label>
                                <input class="form-control" id="email" required="" type="email">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input class="form-control" id="password" minlength="6" required="" type="password">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirm password</label>
                                <input class="form-control" id="confirmPassword" minlength="6" required="" type="password">
                            </div>
                        </div>
                        <button class="btn btn-primary w-100 mt-4">Create account</button>
                        <div class="mt-3" id="msg">
                        </div>
                    </form>
                    <p class="text-secondary mt-4 mb-0">Already registered?<a href="/pages/login.html">Log in</a></p>
                </section>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/register.js"></script>
    </body>
</html>
