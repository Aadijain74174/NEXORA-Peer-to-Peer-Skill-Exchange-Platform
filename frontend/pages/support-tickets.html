<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Tickets | Nexora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/navbar.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold mb-0">Support Tickets</h1>
            <select id="statusFilter" class="form-select w-auto">
                <option value="">All</option>
                <option>Open</option>
                <option>In Progress</option>
                <option>Resolved</option>
            </select>
        </div>
        <div id="ticketList"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/main.js"></script>
    <script>
        requireAuth();
        const listEl = document.getElementById("ticketList");

        async function loadTickets() {
            const status = document.getElementById("statusFilter").value;
            try {
                const data = await api("/chatbot/tickets" + (status ? "?status=" + encodeURIComponent(status) : ""));
                if (!data.tickets.length) {
                    listEl.innerHTML = '<p class="text-muted">No tickets found.</p>';
                    return;
                }
                listEl.innerHTML = data.tickets.map((t) => `
                    <div class="card border-0 shadow-sm p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <strong>${escapeHtml(t.subject)}</strong>
                            <span class="badge bg-secondary">${escapeHtml(t.status)}</span>
                        </div>
                        <small class="text-muted">${escapeHtml(t.name || "Visitor")} &middot; ${escapeHtml(t.email)} &middot; ${new Date(t.createdAt).toLocaleString()}</small>
                        <p class="mt-2 mb-2">${escapeHtml(t.summary)}</p>
                        <div class="d-flex gap-2">
                            <input class="form-control form-control-sm" id="note-${t._id}" placeholder="Admin note" value="${escapeHtml(t.adminNote)}">
                            <select class="form-select form-select-sm w-auto" id="status-${t._id}">
                                ${["Open", "In Progress", "Resolved"].map((s) => `<option ${s === t.status ? "selected" : ""}>${s}</option>`).join("")}
                            </select>
                            <button class="btn btn-sm btn-primary" onclick="saveTicket('${t._id}')">Save</button>
                        </div>
                    </div>`).join("");
            } catch (error) {
                listEl.innerHTML = '<p class="text-danger">' + escapeHtml(error.message) + "</p>";
            }
        }

        async function saveTicket(id) {
            try {
                await api("/chatbot/tickets/" + id, {
                    method: "PATCH",
                    body: JSON.stringify({
                        status: document.getElementById("status-" + id).value,
                        adminNote: document.getElementById("note-" + id).value,
                    }),
                });
                toast("Ticket updated.");
                loadTickets();
            } catch (error) {
                toast(error.message, "danger");
            }
        }

        document.getElementById("statusFilter").addEventListener("change", loadTickets);
        loadTickets();
    </script>
</body>
</html>
