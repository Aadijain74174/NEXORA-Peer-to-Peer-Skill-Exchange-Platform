<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>Login | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
        <link href="/css/navbar.css" rel="stylesheet">
        <link href="/css/animations.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container" style="max-width:520px">
                <section class="card-soft">
                    <span class="text-primary fw-bold small">WELCOME BACK</span>
                    <h1 class="mt-2">Log in to Nexora</h1>
                    <p class="text-secondary">Continue your skill exchange journey.</p>
                    <form class="mt-4" id="loginForm">
                        <label class="form-label">Email</label>
                        <input class="form-control mb-3" id="email" required="" type="email">
                        <label class="form-label">Password</label>
                        <input class="form-control" id="password" required="" type="password">
                        <div class="text-end mt-2">
                            <a
                                href="/pages/forgot-password.html"
                                class="small"
                             >
                                Forgot Password?
                            </a>
                        </div>
                        <button class="btn btn-primary w-100 mt-4">Login</button>
                        <div class="mt-3" id="msg">
                        </div>
                    </form>
                    <p class="text-secondary mt-4 mb-0">New to Nexora?<a href="/pages/register.html">Create an account</a></p>
                </section>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/login.js"></script>
    </body>
</html>
