<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>Find Skills | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
        <link href="/css/navbar.css" rel="stylesheet">
        <link href="/css/animations.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container-fluid container-xxl px-3 px-lg-4">
                <div class="page-header">
                    <span class="text-primary fw-bold small">DISCOVER</span>
                    <h1 class="mt-2">Find skill partners</h1>
                    <p class="text-secondary">Search people by what they can teach, what they want to learn, and their availability.</p>
                </div>
                <section class="card-soft mb-4">
                    <div class="row g-2">
                        <div class="col-lg-5">
                            <label class="form-label">Skill or person</label>
                            <input class="form-control" id="skill" placeholder="Python, design, Rahul...">
                        </div>
                        <div class="col-lg-2">
                            <label class="form-label">Experience</label>
                            <select class="form-select" id="experience">
                                <option>All</option>
                                <option>Beginner</option>
                                <option>Intermediate</option>
                                <option>Advanced</option>
                            </select>
                        </div>
                        <div class="col-lg-2">
                            <label class="form-label">Availability</label>
                            <select class="form-select" id="availability">
                                <option>All</option>
                                <option>Morning</option>
                                <option>Afternoon</option>
                                <option>Evening</option>
                                <option>Weekend</option>
                            </select>
                        </div>
                        <div class="col-lg-2">
                            <label class="form-label">Minimum rating</label>
                            <select class="form-select" id="rating">
                                <option value="0">Any</option>
                                <option value="3">3+</option>
                                <option value="4">4+</option>
                                <option value="4.5">4.5+</option>
                            </select>
                        </div>
                        <div class="col-lg-1 d-flex align-items-end">
                            <button class="btn btn-primary w-100" id="searchBtn">Go</button>
                        </div>
                    </div>
                </section>
                <div class="row g-3" id="results">
                    <div class="loading-state">
                        Loading partners...
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/find-skills.js"></script>
    </body>
</html>
