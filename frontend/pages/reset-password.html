<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Nexora</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="/css/style.css"
        rel="stylesheet"
    >
</head>

<body>

    <div id="appNav"></div>

    <main class="page-shell">

        <div
            class="container"
            style="max-width: 520px;"
        >

            <section class="card-soft">

                <span class="text-primary fw-bold small">
                    NEW PASSWORD
                </span>

                <h1 class="mt-2">
                    Reset your password
                </h1>

                <p class="text-secondary">
                    Create a new password for your Nexora account.
                </p>

                <form
                    id="resetPasswordForm"
                    class="mt-4"
                >

                    <label
                        for="password"
                        class="form-label"
                    >
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control mb-3"
                        minlength="6"
                        required
                    >

                    <label
                        for="confirmPassword"
                        class="form-label"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        minlength="6"
                        required
                    >

                    <button
                        type="submit"
                        class="btn btn-primary w-100 mt-4"
                    >
                        Reset Password
                    </button>

                </form>

                <div
                    id="msg"
                    class="mt-3"
                ></div>

            </section>

        </div>

    </main>

    <script src="/js/main.js"></script>
    <script src="/js/reset-password.js"></script>

</body>

</html>
