<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>Reviews | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container-fluid container-xxl px-3 px-lg-4">
                <div class="page-header">
                    <span class="text-primary fw-bold small">REPUTATION</span>
                    <h1 class="mt-2">Ratings & reviews</h1>
                    <p class="text-secondary">Only completed sessions are eligible for reviews.</p>
                </div>
                <div class="row g-4">
                    <div class="col-lg-6">
                        <section class="card-soft">
                            <h4>Pending reviews</h4>
                            <div class="mt-3" id="eligible">
                                <div class="loading-state">
                                    Loading...
                                </div>
                            </div>
                        </section>
                    </div>
                    <div class="col-lg-6">
                        <section class="card-soft">
                            <h4>Reviews about you</h4>
                            <div class="mt-3" id="myReviews">
                                <div class="loading-state">
                                    Loading...
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/reviews.js"></script>
    </body>
</html>
