<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>Sessions | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container-fluid container-xxl px-3 px-lg-4">
                <div class="page-header">
                    <span class="text-primary fw-bold small">LEARNING SESSIONS</span>
                    <h1 class="mt-2">Schedule & join</h1>
                    <p class="text-secondary">Use a partner's registered name or email. No MongoDB User ID is required.</p>
                </div>
                <section class="card-soft">
                    <form class="row g-3" id="sessionForm">
                        <div class="col-md-6">
                            <label class="form-label">Partner name or email</label>
                            <input autocomplete="off" class="form-control" id="partner" list="partnerList" placeholder="e.g. Rahul or rahul@example.com" required="">
                            <datalist id="partnerList">
                            </datalist>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Skill</label>
                            <input class="form-control" id="skill" placeholder="Python, C++, UI Design" required="">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Date</label>
                            <input class="form-control" id="date" required="" type="date">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Start time</label>
                            <input class="form-control" id="time" required="" type="time">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Duration</label>
                            <select class="form-select" id="duration">
                                <option value="30">30 minutes</option>
                                <option selected="" value="60">60 minutes</option>
                                <option value="90">90 minutes</option>
                                <option value="120">2 hours</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Mode</label>
                            <select class="form-select" id="mode">
                                <option>Online</option>
                                <option>Offline</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Meeting link<span class="text-secondary">(optional)</span></label>
                            <input class="form-control" id="meetingLink" placeholder="https://meet.google.com/... or another meeting URL">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Notes</label>
                            <input class="form-control" id="notes" placeholder="Topics to cover">
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary">Schedule session</button>
                        </div>
                    </form>
                </section>
                <section class="card-soft mt-4">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4>My sessions</h4>
                            <p class="text-secondary small mb-0">Both participants can see the session and use its Join Session room.</p>
                        </div>
                        <a class="btn btn-sm btn-outline-primary" href="/pages/calendar.html">Calendar</a>
                    </div>
                    <div class="mt-3" id="list">
                        <div class="loading-state">
                            Loading sessions...
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/sessions.js"></script>
    </body>
</html>
