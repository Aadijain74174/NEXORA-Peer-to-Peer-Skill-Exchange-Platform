<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Study Groups | Nexora</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/navbar.css" rel="stylesheet">
    <link href="/css/animations.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <div id="appNav"></div>

    <main class="container py-4">

        <!-- Page Header -->
        <section class="mb-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">

                <div>
                    <h1 class="fw-bold mb-1">
                        Study Groups
                    </h1>

                    <p class="text-muted mb-0">
                        Learn together, share knowledge, and grow with your peers.
                    </p>
                </div>

                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#createGroupModal"
                >
                    + Create Study Group
                </button>

            </div>
        </section>


        <!-- Search -->
        <section class="card-soft mb-4">

            <div class="row g-3 align-items-end">

                <div class="col-md-10">
                    <label
                        for="groupSearch"
                        class="form-label fw-semibold"
                    >
                        Search Study Groups
                    </label>

                    <input
                        type="text"
                        id="groupSearch"
                        class="form-control"
                        placeholder="Search by group name, skill, or topic..."
                    >
                </div>

                <div class="col-md-2">
                    <button
                        id="searchGroupBtn"
                        class="btn btn-primary w-100"
                    >
                        Search
                    </button>
                </div>

            </div>

        </section>


        <!-- Tabs -->
        <section class="mb-4">

            <div class="btn-group" role="group">

                <button
                    id="allGroupsBtn"
                    class="btn btn-primary"
                >
                    All Groups
                </button>

                <button
                    id="myGroupsBtn"
                    class="btn btn-outline-primary"
                >
                    My Groups
                </button>

            </div>

        </section>


        <!-- Status -->
        <div id="groupStatus"></div>


        <!-- Groups -->
        <section>

            <div
                id="groupsContainer"
                class="row g-4"
            >
                <!-- Groups will load here -->
            </div>

        </section>

    </main>


    <!-- Create Study Group Modal -->
    <div
        class="modal fade"
        id="createGroupModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title fw-bold">
                        Create Study Group
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <form id="createGroupForm">

                    <div class="modal-body">

                        <div class="mb-3">

                            <label
                                for="groupName"
                                class="form-label fw-semibold"
                            >
                                Group Name
                            </label>

                            <input
                                type="text"
                                id="groupName"
                                class="form-control"
                                placeholder="Example: JavaScript Learners"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="groupSkill"
                                class="form-label fw-semibold"
                            >
                                Skill / Topic
                            </label>

                            <input
                                type="text"
                                id="groupSkill"
                                class="form-control"
                                placeholder="Example: JavaScript"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="groupDescription"
                                class="form-label fw-semibold"
                            >
                                Description
                            </label>

                            <textarea
                                id="groupDescription"
                                class="form-control"
                                rows="3"
                                placeholder="What will members learn in this group?"
                            ></textarea>

                        </div>


                        <div class="row g-3">

                            <div class="col-md-6">

                                <label
                                    for="groupLevel"
                                    class="form-label fw-semibold"
                                >
                                    Level
                                </label>

                                <select
                                    id="groupLevel"
                                    class="form-select"
                                >
                                    <option value="Beginner">
                                        Beginner
                                    </option>

                                    <option value="Intermediate">
                                        Intermediate
                                    </option>

                                    <option value="Advanced">
                                        Advanced
                                    </option>
                                </select>

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="maxMembers"
                                    class="form-label fw-semibold"
                                >
                                    Maximum Members
                                </label>

                                <input
                                    type="number"
                                    id="maxMembers"
                                    class="form-control"
                                    min="2"
                                    max="100"
                                    value="15"
                                >

                            </div>

                        </div>

                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Group
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Main JS -->
    <script src="/js/main.js"></script>

    <!-- Study Groups JS -->
    <script src="/js/study-groups.js"></script>

</body>
</html>
