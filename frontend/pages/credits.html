<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width,initial-scale=1" name="viewport">
        <title>Skill Credits | Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="appNav">
        </div>
        <main class="page-shell">
            <div class="container-fluid container-xxl px-3 px-lg-4">
                <div class="page-header">
                    <span class="text-primary fw-bold small">SKILL ECONOMY</span>
                    <h1 class="mt-2">Skill credits</h1>
                    <p class="text-secondary">Earn credits by completing exchanges and use them for platform actions.</p>
                </div>
                <section class="credit-hero card-soft">
                    <div>
                        <div class="small text-secondary">
                            AVAILABLE BALANCE
                        </div>
                        <div class="display-5 fw-bold" id="balance">
                            0
                        </div>
                        <p class="mb-0 text-secondary">Completed teaching sessions earn 10 credits; learning sessions earn 5.</p>
                    </div>
                    <a class="btn btn-primary" href="/pages/sessions.html">Complete a session</a>
                </section>
                <section class="card-soft mt-4">
                    <h4>Credit history</h4>
                    <div class="mt-3" id="transactions">
                        <div class="loading-state">
                            Loading history...
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <script src="/js/main.js"></script>
        <script src="/js/credits.js"></script>
    </body>
</html>
